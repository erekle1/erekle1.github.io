<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Big Dog Run RPG</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw; /* Full viewport width */
            height: 100vh; /* Full viewport height */
            margin: 0;
            background-color: #f0f8ff; /* Alice Blue */
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent scrolling */
        }

        .game-container {
            background-color: #c8e6c9; /* Light Green */
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 95%; /* Use percentage for responsiveness */
            height: 95%; /* Use percentage for responsiveness */
            max-width: 1200px; /* Cap max width for very large screens */
            max-height: 800px; /* Cap max height */
            box-sizing: border-box; /* Include padding in width/height */
        }

        canvas {
            background-color: #87ceeb; /* Sky Blue */
            display: block;
            border: 5px solid #6a0dad; /* Dark Purple border */
            border-radius: 15px;
            touch-action: manipulation; /* Prevent default touch actions like double-tap zoom */
            flex-grow: 1; /* Allow canvas to take available space */
            width: 100%; /* Ensure canvas takes full width of its container */
            height: auto; /* Allow height to adjust proportionally */
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            flex-shrink: 0; /* Prevent info bar from shrinking */
        }

        .health-bar-container {
            width: 200px;
            height: 20px;
            background-color: #ddd;
            border: 2px solid #555;
            border-radius: 10px;
            overflow: hidden;
            margin-left: 10px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .health-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(to right, #7FFF00, #32CD32);
            transition: width 0.2s ease-out;
            border-radius: 8px;
        }

        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            text-align: center;
            z-index: 20;
            padding: 20px;
            box-sizing: border-box;
        }

        .game-overlay h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        .game-overlay p {
            font-size: 1.5em;
            margin-bottom: 15px;
        }

        .character-selection {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .character-card {
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid #6a0dad;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s ease-in-out, border-color 0.2s ease-in-out, background-color 0.2s ease-in-out;
            text-align: center;
            width: 100px;
            font-size: 1.2em;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .character-card:hover {
            transform: translateY(-5px);
            background-color: rgba(255, 255, 255, 0.2);
        }

        .character-card.selected {
            border-color: #00ff00; /* Green for selected */
            box-shadow: 0 0 15px #00ff00;
            transform: scale(1.05);
        }

        .character-card span {
            font-size: 3em;
            display: block;
            margin-bottom: 5px;
        }

        .game-overlay button {
            background: linear-gradient(145deg, #4CAF50, #2E8B57); /* Green gradient */
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }

        .game-overlay button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .game-overlay button:active {
            transform: translateY(0);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        #gameOverScreen {
            display: none; /* Hidden by default */
        }

        #startScreen {
            display: flex; /* Shown by default */
        }

        /* Dog Thought Bubble Styling */
        #dogThoughtBubble {
            position: absolute;
            background-color: #fff;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 10px 15px;
            font-size: 0.9em;
            color: #333;
            text-align: center;
            white-space: nowrap; /* Prevent text wrapping */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            opacity: 0; /* Hidden by default */
            transition: opacity 0.3s ease-in-out;
            pointer-events: none; /* Allows clicks to pass through */
            z-index: 15; /* Above canvas, below overlays */
        }

        #dogThoughtBubble::after {
            content: '';
            position: absolute;
            bottom: -10px; /* Position the tail below the bubble */
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 20px;
            height: 20px;
            background-color: #fff;
            border-right: 2px solid #333;
            border-bottom: 2px solid #333;
            border-radius: 0 0 5px 0;
            z-index: -1; /* Behind the main bubble */
        }


        @media (max-width: 768px) {
            .game-container {
                padding: 10px;
                width: 98%;
                height: 98%;
            }
            .game-info {
                flex-direction: column;
                align-items: center;
                font-size: 0.9em;
            }
            .health-bar-container {
                margin: 5px 0;
                width: 150px;
            }
            .game-overlay h2 {
                font-size: 2em;
            }
            .game-overlay p {
                font-size: 1.2em;
            }
            .character-card {
                width: 80px;
                padding: 10px;
                font-size: 1em;
            }
            .character-card span {
                font-size: 2.5em;
            }
            .game-overlay button {
                padding: 10px 20px;
                font-size: 1em;
            }
            #dogThoughtBubble {
                font-size: 0.8em; /* Smaller font for mobile */
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="dogThoughtBubble"></div> <!-- Dog thought bubble element -->
        <div class="game-info">
            <div>Score: <span id="scoreDisplay">0</span></div>
            <div style="display: flex; align-items: center;">
                Health:
                <div class="health-bar-container">
                    <div id="healthBar" class="health-bar"></div>
                </div>
            </div>
            <div>High Score: <span id="highScoreDisplay">0</span></div>
        </div>

        <!-- Start Screen Overlay -->
        <div id="startScreen" class="game-overlay">
            <h2>Old Big Dog RPG</h2>
            <p>Choose your companion:</p>
            <div id="characterSelection" class="character-selection">
                <!-- Character cards will be injected here by JavaScript -->
            </div>
            <button id="startButton">Start Game</button>
        </div>

        <!-- Game Over Screen Overlay -->
        <div id="gameOverScreen" class="game-overlay">
            <h2>Game Over!</h2>
            <p>Your Score: <span id="finalScore">0</span></p>
            <button id="restartButton">Play Again</button>
        </div>
    </div>

        <script src="script.js"></script>

</body>
</html>
